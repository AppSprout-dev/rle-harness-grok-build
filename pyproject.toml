[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rle-harness-grok-build"
version = "0.1.0"
description = "Grok Build (xai-org/grok-build) as an RLE harness: a coding agent manages a RimWorld colony over MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# RLE core is not on PyPI yet. Install it first:
#   uv pip install "rimworld-learning-environment[mcp] @ git+https://github.com/AppSprout-dev/RLE"
dependencies = [
    "rimworld-learning-environment>=0.4.1",
    "mcp>=2.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.24", "ruff>=0.1.0", "mypy>=1.0"]

[project.scripts]
rle-grok-docker = "rle_harness_grok_build.docker_cli:main"

[project.entry-points."rle.harnesses"]
grok-build = "rle_harness_grok_build:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/rle_harness_grok_build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["rle_harness_grok_build"]

[tool.mypy]
python_version = "3.14"
strict = true
