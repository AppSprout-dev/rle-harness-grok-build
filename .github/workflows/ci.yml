name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
      - name: Install RLE core (not on PyPI yet)
        run: uv pip install "rimworld-learning-environment[mcp] @ git+https://github.com/AppSprout-dev/RLE" --system
      - name: Install this harness
        run: uv pip install -e ".[dev]" --system
      - run: ruff check src/ tests/
      - run: mypy src/
      - run: pytest -q
      - name: Visible to RLE (unavailable without the binary is expected)
        run: python -c "from rle.harness import format_harness_table; print(format_harness_table())"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe pinned Linux grok-build artifact
        id: probe
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^ARG GROK_VERSION=//p' docker/Dockerfile | head -1 | tr -d '[:space:]')
          echo "Dockerfile pin: $pin"
          echo "version=$pin" >> "$GITHUB_OUTPUT"
          code=$(curl -o /dev/null -sS -w '%{http_code}' --head \
            "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-${pin}-linux-x86_64")
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Pinned Linux grok ${pin} not available (HTTP $code) — skipping image build"
          fi
      - name: Build stock grok-only image
        if: steps.probe.outputs.ok == 'true'
        run: |
          docker build -f docker/Dockerfile \
            --build-arg GROK_VERSION=${{ steps.probe.outputs.version }} \
            -t rle-grok-build:ci .
      - name: Smoke mcp list (no RimWorld, no API key)
        if: steps.probe.outputs.ok == 'true'
        run: |
          set -euo pipefail
          out=$(docker run --rm rle-grok-build:ci mcp list)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qi rle
          if printf '%s\n' "$out" | grep -qiE 'wandb'; then
            echo "unexpected compatibility MCP in grok mcp list" >&2
            exit 1
          fi
      - name: Smoke persist container (docker exec mcp list)
        if: steps.probe.outputs.ok == 'true'
        run: |
          set -euo pipefail
          name="rle-grok-ci-persist-$$"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" rle-grok-build:ci persist
          out=$(docker exec "$name" /entrypoint.sh mcp list)
          docker rm -f "$name"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qi rle
      - name: Note skipped image build
        if: steps.probe.outputs.ok != 'true'
        run: |
          echo "Skipped docker image build; Linux grok artifact missing or unreachable."
          echo "Dockerfile + compose are still in the tree for local use."
