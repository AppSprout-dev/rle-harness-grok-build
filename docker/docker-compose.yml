# Stock Linux grok sidecar. Windows RimWorld + RIMAPI stay on the host
# (localhost:8765). Do not put Steam RimWorld in this container.
#
# Grok dials RLE's advertised MCP URL (sibling RLE PR: McpHost binds
# 0.0.0.0:8766 → http://host.docker.internal:8766/mcp).
#
#   export XAI_API_KEY=xai-...
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm grok mcp list
#
# Do NOT bind-mount host ~/.grok, ~/.grok/config.toml, ~/.claude.json,
# ~/.claude, or ~/.cursor.

services:
  grok:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rle-grok-build:local
    environment:
      XAI_API_KEY: ${XAI_API_KEY:-}
      MCP_URL: ${MCP_URL:-http://host.docker.internal:8766/mcp}
      GROK_HOME: /home/grok/.grok
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional auth.json *file* only:
    #   volumes:
    #     - /abs/path/to/auth.json:/auth/auth.json:ro
    command: ["mcp", "list"]
